name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Simulate every supported device
        run: python tools/simulate_devices.py

      - name: Check the console entry points start
        run: |
          openrazer-win --version
          openrazer-win supported viper
          openrazer-win doctor

  linux-import:
    name: Import check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      # The Windows HID backend is ctypes-only and must still import elsewhere,
      # so the emulator-backed tests can run on any CI runner.
      - run: pytest -q
      - run: python tools/simulate_devices.py

  build:
    name: Build distributions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Verify the wheel installs cleanly
        run: |
          python -m venv fresh
          fresh\Scripts\pip install --no-deps (Get-ChildItem dist\*.whl).FullName
          fresh\Scripts\openrazer-win --version
          fresh\Scripts\python -c "from openrazer_win.devices import get_database; assert len(get_database()) > 250"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  gui:
    name: Control panel (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        # The version pinned in gui/rust-toolchain.toml.
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/target
          key: gui-${{ runner.os }}-${{ hashFiles('gui/Cargo.lock') }}
      - name: Lint
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check the build that carries the daemon
        # Any file stands in for the frozen daemon; this only compiles that path.
        env:
          OPENRAZER_EMBED_DAEMON: ${{ github.workspace }}/gui/Cargo.toml
        run: cargo check --locked
      - name: Build
        run: cargo build --release --locked
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/openrazer-win-gui.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          exit 0

  studio:
    name: OpenRazer Studio (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        # The version pinned in studio/rust-toolchain.toml.
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            studio/target
          key: studio-${{ runner.os }}-${{ hashFiles('studio/Cargo.lock') }}
      - name: Every string has a Russian translation
        run: python tools/check_translations.py
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p openrazer-studio
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/openrazer-studio.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          exit 0
      - name: Build the installer
        # Any program stands in for the frozen daemon here; the release
        # workflow puts the real one in.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/payload | Out-Null
          Copy-Item target/release/openrazer-studio.exe target/payload/
          Copy-Item target/release/openrazer-studio.exe target/payload/openrazer-win.exe
          $env:OPENRAZER_STUDIO_PAYLOAD = "$PWD/target/payload"
          cargo build --release --locked -p openrazer-studio-setup
      - name: Install, repair and remove
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\lad"
          ./tools/installer-cycle.ps1 -Setup target/release/openrazer-studio-setup.exe -Dir "$env:RUNNER_TEMP\studio-install"
