name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - artifact: wheel
          - artifact: exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build wheel and sdist
        if: matrix.artifact == 'wheel'
        run: |
          pip install build
          python -m build

      - name: Build standalone executables
        if: matrix.artifact == 'exe'
        # A regular install, not editable: PyInstaller cannot follow imports
        # through a PEP 660 editable finder, and silently produced a binary
        # that could not import openrazer_win.cli.  The [ble] extra is included
        # so the standalone binary can drive Bluetooth devices too -- there is
        # no "pip install the extra" answer for someone using the exe.
        run: |
          pip install ".[ble]"
          pip install pyinstaller
          pyinstaller --clean --noconfirm packaging/openrazer-win.spec

      - name: Smoke-test the executable
        if: matrix.artifact == 'exe'
        # The runner appends `exit $LASTEXITCODE`, so the script has to end on a
        # deliberate exit: `autostart status` reports 1 when autostart is off,
        # which is the expected state on a fresh runner.
        run: |
          .\dist\openrazer-win.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\openrazer-win.exe supported viper
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\openrazer-win.exe doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\openrazer-win.exe autostart status
          if ($LASTEXITCODE -notin 0, 1) { exit 1 }
          exit 0
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: error

  gui:
    name: Build the control panel
    # It carries the frozen daemon inside it, so it is built after that.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: daemon
      - name: Install Rust
        # The version pinned in gui/rust-toolchain.toml.
        working-directory: gui
        run: rustup toolchain install
      - name: Build
        working-directory: gui
        env:
          OPENRAZER_EMBED_DAEMON: ${{ github.workspace }}/daemon/openrazer-win.exe
        run: cargo build --release --locked
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # --self-test also fails a build whose embedded daemon is missing or broken.
          $p = Start-Process -FilePath gui/target/release/openrazer-win-gui.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if ((Get-Item gui/target/release/openrazer-win-gui.exe).Length -lt 10MB) { Write-Error 'no daemon inside'; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item gui/target/release/openrazer-win-gui.exe dist/
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: gui
          path: dist/openrazer-win-gui.exe
          if-no-files-found: error

  studio:
    name: Build OpenRazer Studio and its installer
    # The installer carries the frozen daemon, so it is built after that.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: daemon
      - name: Install Rust
        # The version pinned in studio/rust-toolchain.toml.
        run: rustup toolchain install
      - name: Build Studio
        run: cargo build --release --locked -p openrazer-studio
      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/payload | Out-Null
          Copy-Item target/release/openrazer-studio.exe target/payload/
          Copy-Item ../daemon/openrazer-win.exe target/payload/
          $env:OPENRAZER_STUDIO_PAYLOAD = "$PWD/target/payload"
          cargo build --release --locked -p openrazer-studio-setup
      - name: Install, repair and remove
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/openrazer-studio-setup.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error 'no program inside the installer'; exit 1 }
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\lad"
          ./tools/installer-cycle.ps1 -Setup target/release/openrazer-studio-setup.exe -Dir "$env:RUNNER_TEMP\studio-install"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item target/release/openrazer-studio-setup.exe ../dist/
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: studio
          path: dist/openrazer-studio-setup.exe
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Keep only the Python distributions
        run: |
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  release:
    name: Publish the release
    needs: [build, gui, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published, with checksums
        # The executables are not code-signed; the checksums let anyone check
        # that what they downloaded is what this workflow built.
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            **OpenRazer Studio** -- download `openrazer-studio-setup.exe` below and
            run it. It installs for your account only (no administrator prompt),
            brings the daemon with it, and repairs or removes itself from
            *Settings › Apps*, the Start menu, or Studio's own settings.

            The classic control panel is still here: `openrazer-win-gui.exe`
            runs as is, with the daemon inside it. `openrazer-win.exe` is the
            command line, for scripts and terminals. Or install with pip:

            ```
            pip install openrazer-win
            ```

            `SHA256SUMS.txt` lists the checksum of every file; the executables
            are not code-signed.

            Device data generated from upstream OpenRazer. See the
            [documentation](https://ar4ikov.github.io/openrazer-win/) for details.
