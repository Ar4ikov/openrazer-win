name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - artifact: wheel
          - artifact: exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build wheel and sdist
        if: matrix.artifact == 'wheel'
        run: |
          pip install build
          python -m build

      - name: Build standalone executables
        if: matrix.artifact == 'exe'
        # A regular install, not editable: PyInstaller cannot follow imports
        # through a PEP 660 editable finder, and silently produced a binary
        # that could not import openrazer_win.cli.  The [ble] extra is included
        # so the standalone binary can drive Bluetooth devices too -- there is
        # no "pip install the extra" answer for someone using the exe.
        run: |
          pip install ".[ble]"
          pip install pyinstaller
          pyinstaller --clean --noconfirm packaging/openrazer-win.spec

      - name: Smoke-test the executable
        if: matrix.artifact == 'exe'
        # The runner appends `exit $LASTEXITCODE`, so the script has to end on a
        # deliberate exit: `autostart status` reports 1 when autostart is off,
        # which is the expected state on a fresh runner.
        run: |
          .\dist\openrazer-win.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\openrazer-win.exe supported viper
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\openrazer-win.exe doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\openrazer-win.exe autostart status
          if ($LASTEXITCODE -notin 0, 1) { exit 1 }
          exit 0
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Keep only the Python distributions
        run: |
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            Install with pip:

            ```
            pip install openrazer-win
            ```

            Or download `openrazer-win.exe` below and run it without Python at all.

            Device data generated from upstream OpenRazer. See the
            [documentation](https://ar4ikov.github.io/openrazer-win/) for details.
