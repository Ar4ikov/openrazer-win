[package]
name = "openrazer-studio"
description = "OpenRazer Studio: Razer device control on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "openrazer-studio"
path = "src/main.rs"

[dependencies]
openrazer-studio-core.workspace = true
eframe.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
winreg.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# The Linux backend is ksni (D-Bus, pure Rust) rather than the default
# libappindicator, which drags in an unsound glib; this is built for Windows.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
winresource = "0.1"
